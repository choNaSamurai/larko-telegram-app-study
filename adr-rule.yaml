rule:
  name: adr_triggers_tma_architecture_analysis
  description: >
    Whenever the user sends a message in the format "ADR [scenario/*]",
    the system must invoke the software_architect_tma role to produce an
    Industrial-grade Architecture & Tech Stack analysis. Includes mandatory
    file structure mapping, TanStack Query cache policies (stale/gc), and 
    fallback assumptions for [BLOCKING] questions.

  trigger:
    type: message_pattern
    pattern: "^ADR\\s+scenario\\/.*"

  actions:
    - type: load_role
      path: .agents/roles/software_architect_tma.yaml

    - type: set_context
      context:
        platform: telegram_mini_app
        architecture_focus: true
        constraints:
          ui_environment: webview
          navigation_model: single_surface
          auth: telegram_user
          state_management: lightweight
          offline_support: high
          caching_strategy: advanced
          performance_priority: high
          backend_integration: api_first

    - type: execute_analysis
      mode: telegram_mini_app_architecture_and_tech_stack
      inputs:
        source: figma
        scenario: "{{link}}"
        context_paths:
          - /Users/pavlyshyn/AI/ai-wt(27032026)/ba

    - type: include_context
      paths:
        - /Users/pavlyshyn/AI/ai-wt(27032026)/ba

  output:
    format: structured_architecture_report
    description: >
      A concise summary of the software_architect_tma result, describing what was analyzed,
      key findings, and the main technical/product insights in a compact form.